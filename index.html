    <h2>The Bottom Line, Per Condo</h2>
    <table>
      <tr><th>Line</th><th>204 — Seabean</th><th>206 — Beach Cruiser</th></tr>
      <tr><td class=&quot;dim&quot;>Sale price</td><td>$229,000</td><td>$231,000</td></tr>

      <tr><td class=&quot;dim&quot;>Less tax reserve → securities</td><td>$21,000</td><td>$0 (deferred)</td></tr>
      <tr class=&quot;big&quot;><td>What we keep</td><td class=&quot;keep&quot;>$73,415.68 to deploy</td><td class=&quot;keep&quot;>$96,814.22 buying power</td></tr>
    </table>

    <div class=&quot;callout&quot;><strong>How the money works:</strong> 206's full equity rolls into the 1031 replacement — tax-deferred, reinvested in full. 204's cash (after tax) is put to work as below.</div>
    <table style=&quot;max-width:480px;&quot;>

    <div class=&quot;callout&quot;><strong>Closing costs — the line item this plan was missing.</strong>
      There is <b>no cash set aside for closing costs</b>. Buyer costs run 2–3% of purchase price, and every
      dollar the seller credit fails to cover comes straight out of renovation.
      <b>A 2% seller credit is required on every offer</b> — at the $484,071 planning case that's an ask of
      <b>$9,681</b>. Closing costs run ~2.5% against a 2% cap, so plan on ~0.5% of price (~$2,421) coming
      out of reno. <b>Budget renovation at $39,000</b>, not $41,416, and treat the rest as found money.</div>

    <div class=&quot;callout&quot;><strong>&amp;#9888; Escrow refund — watch this around Sept 3.</strong>
      A <b>~$1,977.17</b> escrow refund is expected from the 206 closing roughly 20 days out.
      <b>Planned routing: SETCO sends it to Asset Preservation as additional exchange funds</b> — which keeps
      it inside the exchange and out of reach of the boot rules. <b>This routing is our assumption and has
      not been confirmed by anyone.</b> Put it in writing to SETCO and API before it is disbursed.

        <b>taxable boot</b> — after we deliberately took $0 at closing to protect the full deferral.<br>
        <b>Deliberately NOT counted in the down payment.</b> The buy box runs on the documented
        $96,814.22. If the refund routes to API and is confirmed, equity becomes about <b>$98,791.39</b> —
        treat that as upside, never as budget.
      </div></div>

    <h2>The 204 Tax — For the CPA to Confirm</h2>
    <p style=&quot;font-size:12.5px;color:#5a6b65;margin:-8px 0 12px;&quot;><b>Payton</b> is our CPA (Payton Gillis, Tax Game Plan Firm) — these are the figures he's confirming.</p>
    <table>
      <tr><th>How the gain is taxed</th><th>Amount</th><th>Rate</th><th>Est. tax</th></tr>
      <tr><td class=&quot;dim&quot;>Depreciation recapture</td><td>$49,166</td><td>up to 25%</td><td>~$12,300</td></tr>
      <tr><td class=&quot;dim&quot;>Long-term capital gain</td><td>~$46,800</td><td>15%</td><td>~$7,000</td></tr>
      <tr><td class=&quot;dim&quot;>Arizona capital gains</td><td>on ~$96,000</td><td>1.875%</td><td>$1,800</td></tr>
      <tr><td class=&quot;dim&quot;>NIIT</td><td>—</td><td>Exempt via REPS</td><td class=&quot;keep&quot;>$0</td></tr>
      <tr class=&quot;big&quot;><td>Confirmed total — Payton, Aug 11 2026</td><td></td><td></td><td>~$20,500</td></tr>
      <tr class=&quot;big&quot;><td>Reserved (with cushion)</td><td></td><td></td><td class=&quot;keep&quot;>$21,000</td></tr>
    </table>
    <div class=&quot;callout&quot;><strong>Two flags for Payton (our CPA):</strong> there's <b>no passive-loss cushion</b> — Payton confirmed I qualify for <b>REPS</b>, so those losses were already used. And <b>NIIT (3.8%) is an open question</b> — REPS may take this sale out of it; Payton is reconciling that (a ~$1,800–3,600 swing).
      <div style=&quot;margin-top:9px;font-size:12px;color:#5a6b65;line-height:1.5;&quot;>
        <b>NIIT — Net Investment Income Tax:</b> a 3.8% federal tax on investment income (including gains from selling an investment property) for taxpayers above certain income thresholds.<br>
        <b>REPS — Real Estate Professional Status:</b> an IRS status. Qualifying (by materially participating in your real estate) makes rental activity non-passive — so losses can offset ordinary income, and it may remove the NIIT on a rental-property sale.
      </div>

    <h1>The Buy Box</h1>
    <p class=&quot;tag&quot;>What we're shopping for — the equity, the debt floor, the revenue bar, and the price ladder.</p>

    <h2>The 1031 Buying Power</h2>

    </div>
    <div class=&quot;callout&quot;><strong>My earning-power target:</strong> I'm aiming for the property to gross around <b>30% of its purchase price per year</b> — <b>$145,221</b> at the $484,071 planning case, or <b>$116,177</b> if we land at $387,257. That's my aggressive goal, not a hard cutoff. A property that lands close to 30% still earns a serious look; anything under <b>20%</b> gets removed from the list. Note the bar moves with the ladder: a lower price isn't a worse deal, it's a smaller number to beat.</div>
    <div class=&quot;lead&quot;>To defer 100% of the gain: buy replacement real estate <b>≥ $231,000</b>, reinvest <b>all $96,814</b> of equity, and carry a new loan of <b>≥ ~$116,773</b> (or add cash). Anything pulled out in cash is taxable &quot;boot.&quot;</div>

    <h2>The Real Price Ladder — Driven by Down Payment %</h2>
    <p style=&quot;font-size:13.5px;margin-bottom:8px;&quot;>Down payment is fixed at <b>$96,814.22</b> (the 206 equity) — there is no second source of funds. So we don't pick a price and hope the percentage works: <b>price = equity ÷ the lender's minimum down payment</b>. DSCR / STR loan at ~7.5% / 30-yr. <b>Renovation budget $39,000</b> after the closing-cost gap.</p>
    <p style=&quot;font-size:12.5px;color:#C0392B;font-weight:700;margin-bottom:8px;&quot;>The old $500K / $525K / $550K ladder is retired — against $96,814 down those were 19.4% / 18.4% / 17.6%, all below the 20% floor. They were never fundable.</p>

    <div class=&quot;callout alert&quot;><strong>Where the old $550K number came from — and why it was wrong.</strong>
      The previous ladder <b>picked prices first and never checked the down payment percentage.</b> Against
      $96,814.22, a $550,000 purchase implies <b>17.6% down</b> — a product that does not exist for an
      investment property vested in an LLC. Conventional stops at 15% but cannot lend to an entity; DSCR
      floors at 20%, commonly 25%.

        <tr><th>To buy at</th><th>20% down requires</th><th>We have</th><th>Short by</th></tr>
        <tr class=&quot;big hl&quot;><td>$484,071</td><td>$96,814</td><td>$96,814</td><td class=&quot;keep&quot;>$0 — our ceiling</td></tr>

        <b>The old sweet spot was not wildly wrong — it was $3,186 of down payment away from being real,
        and nobody had checked.</b> 20% is a FLOOR, not a preference: below it no product exists for us.
      </div></div>

    <div class=&quot;callout&quot;><strong>What &quot;P&amp;amp;I&quot; means — and what it does NOT mean.</strong>
      P&amp;amp;I is <b>Principal and Interest only: the loan payment.</b> It is not the all-in monthly cost and it is
      not a ceiling on personal bills. What actually leaves the account each month is <b>PITIA</b> —
      Principal, Interest, Taxes, Insurance, Association dues.
      <table style=&quot;margin-top:10px;&quot;>
        <tr><th>Down %</th><th>Price</th><th>P&amp;amp;I only</th><th>Taxes ~0.5%</th><th>Insurance</th><th>PITIA — true cost</th></tr>
        <tr class=&quot;big hl&quot;><td>20%</td><td>$484,071</td><td>$2,708</td><td>~$202</td><td>~$275</td><td class=&quot;keep&quot;>~$3,185</td></tr>
        <tr><td class=&quot;dim&quot;>25%</td><td>$387,257</td><td>$2,031</td><td>~$161</td><td>~$275</td><td class=&quot;keep&quot;>~$2,467</td></tr>
        <tr><td class=&quot;dim&quot;>30%</td><td>$322,714</td><td>$1,579</td><td>~$134</td><td>~$275</td><td>~$1,988</td></tr>
      </table>
      <div style=&quot;margin-top:4px;font-size:12px;color:#5a6b65;line-height:1.5;&quot;>
        Tax and insurance are estimates — AZ property tax ~0.5% of value, insurance benchmarked to the Phoenix
        home at $3,503/yr. <b>Rural and wildfire-exposed markets can run much higher — confirm insurance before
        falling for a property.</b> HOA assumed $0.<br><br>
        <b>PITIA is what the lender tests.</b> On DSCR the question is never what Nicole can afford personally —
        it is whether the property's rent covers its own payment, at 1.0x minimum and often 1.25x. At $387,257:
        our STR target of $116,177/yr (~$9,681/mo) gives a DSCR of <b>3.9 — outstanding</b>; long-term market rent
        of ~$2,500–3,000 gives <b>1.0–1.2 — marginal</b>. Same property, opposite outcome.
      </div></div>

    <div class=&quot;callout&quot;><strong>How to read this ladder.</strong>
      The down payment is fixed at <b>$96,814.22</b>, so the price does not change what we have &amp;mdash; it changes
      <b>what percentage our money represents</b>. That percentage is the whole game, because it is what a lender
      tests against its minimum.
      <div style=&quot;margin-top:9px;font-size:12.5px;color:#5a6b65;line-height:1.6;&quot;>
        <b>The three reach targets</b> ($500K&amp;ndash;$550K) are not impossible &amp;mdash; they are <b>$3,186 to $13,186 of
        additional cash away</b>. That is the only thing standing between us and them. Keep them on the board.<br><br>
        <b>$484,071 is the exact ceiling</b> where our money lands on 20.00% with nothing added. This is the
        planning case.<br><br>
        <b>$450K and $425K buy cushion.</b> At $425,000 our money is 22.78% down, which means roughly $11,814 of
        slack &amp;mdash; that surplus can cover closing costs, boost reserves, or absorb a lender who wants more than 20%.
        A lower price is not a lesser deal; it is a stronger position.<br><br>
        <b>$387,257 is the fallback</b> if Parker's product floors at 25%. Still clears every 1031 requirement.
      </div></div>

      <div class=&quot;tile&quot;><div class=&quot;v&quot;>#213113</div><div class=&quot;l&quot;>Exchange</div></div>
      <div class=&quot;tile&quot;><div class=&quot;v&quot;>206 · Beach Cruiser</div><div class=&quot;l&quot;>Relinquished</div></div>
      <div class=&quot;tile&quot;><div class=&quot;v&quot;>~Sep 28, 2026</div><div class=&quot;l&quot;>Identify by (45 days)</div></div>
      <div class=&quot;tile&quot;><div class=&quot;v&quot;>~Feb 10, 2027</div><div class=&quot;l&quot;>Close by (180 days)</div></div>
    </div>

    <p class=&quot;lead&quot;><b>The one rule that drives everything:</b> a 1031 defers capital-gains tax only on money that <i>stays</i> in real estate. Any cash pulled out — for the card or anything personal — is <b>&quot;boot,&quot;</b> and it's taxable. We're doing a <b>full</b> deferral on 206, so all of its equity rolls into the next property.</p>

    <h2>The Two Deadlines — from the Aug 14 close of 206</h2>
    <div class=&quot;two&quot;>
      <div class=&quot;card dead&quot;>
        <div class=&quot;when&quot;>45-Day Identification</div>
        <h3>Identify by ~Sept 28, 2026</h3>
        <p>Identify — in writing to API — every replacement property we might buy, by midnight of the 45th day after 206 closes. Up to three. Any property we actually close before day 45 counts as identified the day it closes.</p>
      </div>
      <div class=&quot;card dead&quot;>
        <div class=&quot;when&quot;>180-Day Exchange</div>
        <h3>Close by ~Feb 10, 2027</h3>
        <p>Acquire the replacement by the earlier of the 180th day after 206's close, or the due date (with extensions) of our tax return for the sale year. Contact API the moment we go under contract so they can prep the paperwork.</p>
      </div>
    </div>

    <h2>Requirements for Full Tax Deferral</h2>
    <ol class=&quot;req&quot;>
      <li>Purchase replacement real estate for <b>not less than 206's sale price, less commissions and certain closing costs</b> (so roughly <b>≥ $231,000</b>).</li>
      <li>Use <b>all</b> of the net proceeds from the sale to acquire the replacement — reinvest the full <b>$96,814</b> of equity.</li>
      <li>Replace the debt: carry <b>≥ ~$116,773</b> of new loan on the replacement (or make up any shortfall with added cash).</li>
    </ol>
    <div class=&quot;callout&quot;><strong>Watch this one:</strong> paying off the loan on 206 does <b>not</b> reduce the amount we must spend on the replacement. The spend target is based on the <i>sale price</i>, not the equity we walk away with.</div>

    <h2>Definitions — the words that matter</h2>
    <dl class=&quot;def&quot;>
      <dt>Like-Kind / Real Property</dt>
      <dd>Section 1031 only exchanges real property held for business or investment use, for property of a like kind. Anything that isn't investment/business real property (and is given a value at closing) falls out of the exchange.</dd>
      <dt>Boot</dt>
      <dd>Any value we receive that isn't like-kind real property — cash pulled out, or debt relief we don't replace. Boot is the taxable part. Full deferral = zero boot (our Section 7 boot is $0).</dd>
      <dt>The G6 Restriction (why we can't touch the money)</dt>
      <dd>IRS reg §1.1031(k)-1(g)(6) blocks us from accessing the funds held in the exchange account during the exchange. API can only release them at the earlier of: (a) after we've acquired <b>all</b> identified replacement property, or (b) the day after day 180 — barring a narrow written, out-of-our-control contingency.</dd>
    </dl>

    <h2>Closing Costs — what's safe vs. what creates boot</h2>
    <div class=&quot;cols&quot;>
      <div class=&quot;col ok&quot;>
        <h4>✓ Deductible — no taxable event</h4>
        <ul>
          <li>Real estate commissions</li>
          <li>Title insurance premiums</li>
          <li>Closing / escrow fees</li>
          <li>Qualified Intermediary fees</li>
          <li>Recording fees</li>
        </ul>
      </div>
      <div class=&quot;col no&quot;>
        <h4>✕ Paying these from proceeds can create boot</h4>
        <ul>
          <li>Property taxes</li>
          <li>Loan fees</li>
          <li>Utility charges</li>
          <li>Association (HOA) fees</li>
          <li>Credits for lease / security deposits</li>
        </ul>
      </div>
    </div>
    <p style=&quot;font-size:12px;color:#6b7d77;margin-top:8px;&quot;>Review any specific cost with Payton (our CPA) before it's paid from exchange proceeds.</p>

    <h2>The Process, Start to Finish</h2>
    <ol class=&quot;steps&quot;>
      <li>206 closes (Aug 14) → API receives the proceeds and sends automated notices with our exact 45- and 180-day dates.</li>
      <li>API sends the Replacement Property Identification Form — we identify in writing by day 45.</li>
      <li>The moment we're under contract on a replacement, we contact API with the details so they can prepare documents.</li>
      <li>We sign the Exchange Documents <b>before</b> that closing — required to include the purchase in the exchange and to let API disburse funds.</li>
      <li>API reviews every disbursement request and verifies wire instructions before any funds are released.</li>
    </ol>

    <div class=&quot;contact&quot;>
      <b>Our Exchange Team — Asset Preservation, Inc.</b><br>
      Anna Marty, Senior Exchange Counselor · teamanna@apiexchange.com · (800) 282-1031 ext. 3933 · Exchange #213113 (Order 213113-REL30581).
    </div>

    <div class=&quot;foot&quot;>
      Source: Asset Preservation, Inc. &quot;1031 Exchange Account — What You Need to Know&quot; (Exchange #213113, Jul 24 2026). API is a Qualified Intermediary and cannot give tax or legal advice; confirm all tax questions with Payton Gillis, CPA. Business planning summary — not tax or legal advice. Banana Slug Getaways.
    </div>

<div class=&quot;page&quot;>

  <div class=&quot;hero&quot;>
    <p class=&quot;eyebrow&quot;>Banana Slug Getaways · Loan Approval</p>
    <h1>Ask Parker</h1>
    <p class=&quot;tag&quot;>Every open question gating the 1031 replacement purchase — one list, checked off as answers land.</p>
  </div>

  <div class=&quot;inner&quot;>

    <div class=&quot;meta&quot;>
      <div class=&quot;m&quot;><div class=&quot;l&quot;>Call</div><div class=&quot;v&quot;>Thu Aug 20</div><div class=&quot;n&quot;>10:00 AM Arizona</div></div>
      <div class=&quot;m&quot;><div class=&quot;l&quot;>You call her</div><div class=&quot;v&quot;>865-292-4436</div><div class=&quot;n&quot;>Parker Borofsky</div></div>
      <div class=&quot;m&quot;><div class=&quot;l&quot;>Lender</div><div class=&quot;v&quot;>Movement</div><div class=&quot;n&quot;>NMLS 1460526</div></div>
      <div class=&quot;m&quot;><div class=&quot;l&quot;>Application</div><div class=&quot;v&quot;>EasyApp</div><div class=&quot;n&quot;>easyapp.movement.com</div></div>
    </div>

    <div class=&quot;lead&quot;><b>How to use this tab:</b> each question is marked OPEN until an answer lands. When
      you get one, we record it in the answer box, flip the marker to ANSWERED, and push the consequence
      into the Financial Picture and Buy Box tabs so the numbers stay in one place.</div>

    <div class=&quot;callout alert&quot;><strong>Two questions decide everything else.</strong> Q1 (vesting) decides
      whether this loan is even possible in its current shape. Q2 (minimum down payment) sets the entire
      buy box, because our down payment is fixed at 96,814.22 and price equals equity divided by that
      percentage. Ask those two first, before anything else.</div>

    <h2>For Parker — Movement Mortgage</h2>

    <div class=&quot;q p1&quot;>
      <div class=&quot;top&quot;><div class=&quot;box&quot;>[ ]</div><div class=&quot;ask&quot;>TITLE IS GOING TO AN LLC — CONFIRMED. Which of your products can close that, and what does it cost me?<span class=&quot;tagp a&quot;>Blocking</span></div></div>
      <div class=&quot;why&quot;>This is no longer an if. Payton and the exchange specialists have confirmed we purchase in a NEW LLC governed by First Mountain, mirroring the Front Beach 206 structure. Conventional loans generally cannot vest in an LLC, so expect DSCR or portfolio. Lead the call with this — it determines product, rate, minimum down payment, and concession cap all at once, and it may mean the EasyApp consumer application is not the right intake at all. Nicole will be a personal guarantor either way.</div>
      <div class=&quot;ans&quot;>Answer: ___________________________________________</div>
    </div>

    <div class=&quot;q p1&quot;>
      <div class=&quot;top&quot;><div class=&quot;box&quot;>[ ]</div><div class=&quot;ask&quot;>What is your minimum down payment on this product?<span class=&quot;tagp a&quot;>Open</span></div></div>
      <div class=&quot;why&quot;>This single number sets our maximum purchase price. At 20 percent we shop to 484,071. At 25 percent we shop to 387,257. Nothing else about the search can be finalized until this is known.</div>
      <div class=&quot;ans&quot;>Answer: ___________________________________________</div>
    </div>

    <div class=&quot;q p2&quot;>
      <div class=&quot;top&quot;><div class=&quot;box&quot;>[ ]</div><div class=&quot;ask&quot;>What is your maximum seller concession on an investment property — 2 percent or 3 percent?<span class=&quot;tagp b&quot;>Open</span></div></div>
      <div class=&quot;why&quot;>Conventional caps investment-property concessions at 2 percent. Closing costs run about 2.5 percent. That half-point spread comes out of our renovation budget. If her product allows 3 percent, the gap closes entirely and reno stays whole.</div>
      <div class=&quot;ans&quot;>Answer: ___________________________________________</div>
    </div>

    <div class=&quot;q p2&quot;>
      <div class=&quot;top&quot;><div class=&quot;box&quot;>[ ]</div><div class=&quot;ask&quot;>Can loan costs be rolled into the loan?<span class=&quot;tagp b&quot;>Open</span></div></div>
      <div class=&quot;why&quot;>We have zero free cash for closing costs. More debt never hurts a 1031 — the rule is a debt floor, not a ceiling. This is the cleanest fix available if her product allows it.</div>
      <div class=&quot;ans&quot;>Answer: ___________________________________________</div>
    </div>

    <div class=&quot;q p1&quot;>
      <div class=&quot;top&quot;><div class=&quot;box&quot;>[ ]</div><div class=&quot;ask&quot;>Do you underwrite SHORT-TERM RENTAL revenue, or LONG-TERM MARKET RENT?<span class=&quot;tagp a&quot;>Blocking</span></div></div>
      <div class=&quot;why&quot;>This one question decides the deal, and it is the kind that surfaces too late. On a $484,071 property the all-in payment lands around $3,400-3,800/mo. Against the 30%-of-price revenue target ($145,221/yr, ~$12,100/mo) the DSCR is roughly 3.4x &amp;mdash; excellent. Against long-term market rent of maybe $2,500-3,000/mo it is about 0.8x &amp;mdash; a FAIL. Same property, same loan, opposite outcome. Ask BEFORE shopping, because it changes which properties are even viable.<br><br>Follow-ups: if STR revenue counts, what proof do you need &amp;mdash; AirDNA, a 1007 rent schedule, my own operating history on the cabin and dome? And do you apply a haircut to STR projections?</div>
      <div class=&quot;ans&quot;>Answer: ___________________________________________</div>
    </div>

    <div class=&quot;q p1&quot;>
      <div class=&quot;top&quot;><div class=&quot;box&quot;>[ ]</div><div class=&quot;ask&quot;>What are your reserve requirements — how many months of PITI, and is it per financed property?<span class=&quot;tagp a&quot;>Blocking &amp;middot; my weak spot</span></div></div>
      <div class=&quot;why&quot;>The quiet deal-killer. Six months per property across the cabin, the dome, and this one could run tens of thousands on top of the down payment — and our free cash is zero. If reserves exceed what we have, the price target must come down.</div>
      <div class=&quot;ans&quot;>Answer: ___________________________________________</div>
    </div>

    <div class=&quot;q p3&quot;>
      <div class=&quot;top&quot;><div class=&quot;box&quot;>[ ]</div><div class=&quot;ask&quot;>Give me a realistic closing-cost estimate at 400K and at 485K.<span class=&quot;tagp c&quot;>Open</span></div></div>
      <div class=&quot;why&quot;>We budget 2.5 percent. If her real number is 3 percent, renovation drops from 39,000 to about 36,575 and we need to know now, not at the table.</div>
      <div class=&quot;ans&quot;>Answer: ___________________________________________</div>

<script>
  var cur=0, N=11;
  var tabs=[].slice.call(document.querySelectorAll('.tab'));
  var panels=[].slice.call(document.querySelectorAll('.panel'));
  var prevBtn=document.getElementById('prevBtn'), nextBtn=document.getElementById('nextBtn');
  function resizeFrame(p){ var f=p.querySelector('iframe'); if(f){ try{ f.style.height=(f.contentWindow.document.documentElement.scrollHeight+24)+'px'; }catch(e){} } }
  function show(i){ if(i<0||i>=N) return; cur=i;
    tabs.forEach(function(t,j){ t.classList.toggle('active', j===i); });
    panels.forEach(function(p,j){ p.classList.toggle('show', j===i); });
    prevBtn.disabled=(i===0); nextBtn.disabled=(i===N-1);
    setTimeout(function(){ resizeFrame(panels[i]); }, 80);
    window.scrollTo({top:0,behavior:'smooth'});
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ show(parseInt(t.getAttribute('data-i'),10)); }); });
  prevBtn.onclick=function(){ show(cur-1); };
  nextBtn.onclick=function(){ show(cur+1); };
  prevBtn.disabled=true;
  document.querySelectorAll('iframe.rpt').forEach(function(f){ f.addEventListener('load', function(){ var p=f.closest('.panel'); if(p.classList.contains('show')) resizeFrame(p); }); });
</script>
